<script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const counter = document.getElementById('counter');
      const progress = document.getElementById('progress');
      let index = Math.max(0, Math.min(slides.length - 1, Number(location.hash.slice(1)) - 1 || 0));

      function show(next) {
        next = Math.max(0, Math.min(slides.length - 1, next));
        slides.forEach((slide, i) => {
          slide.classList.toggle('active', i === next);
          slide.classList.toggle('leaving', i < next);
          slide.setAttribute('aria-hidden', i === next ? 'false' : 'true');
        });
        index = next;
        location.hash = String(index + 1);
        counter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
        progress.style.width = `${((index + 1) / slides.length) * 100}%`;
      }

      document.getElementById('prev').addEventListener('click', () => show(index - 1));
      document.getElementById('next').addEventListener('click', () => show(index + 1));
      addEventListener('keydown', event => {
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(index + 1); }
        if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); show(index - 1); }
        if (event.key === 'Home') show(0);
        if (event.key === 'End') show(slides.length - 1);
        if (event.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.();
      });
      let startX = 0;
      addEventListener('touchstart', e => startX = e.changedTouches[0].clientX, { passive: true });
      addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - startX; if (Math.abs(dx) > 55) show(index + (dx < 0 ? 1 : -1)); }, { passive: true });
      show(index);
    })();
  </script>
