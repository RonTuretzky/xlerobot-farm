<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 435" role="img" aria-labelledby="title desc"><title id="title">ESP32 USB sensor link</title><desc id="desc">A USB data cable connects the hub to ESP32. Sensor readings return over USB serial through the hub to the Mac.</desc><defs><pattern id="water" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 8 Q4 3 8 8 T16 8" fill="none" stroke="#154d77" opacity=".35"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#154d77"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172a34;font-size:18px}.label{font-size:15px}.head{font-weight:750}.wire{fill:none;stroke:#154d77;stroke-width:3}.power{fill:none;stroke:#a84c0b;stroke-width:3;stroke-dasharray:8 5}.box{fill:#fffefa;stroke:#172a34;stroke-width:2}</style><rect width="450" height="435" fill="#fffefa"/><rect class="box" x="90" y="15" width="270" height="60" rx="12"/><text x="225.0" y="43" class="head" text-anchor="middle">Powered hub</text><text x="225.0" y="67" class="label" text-anchor="middle">USB port</text><rect class="box" x="90" y="155" width="270" height="70" rx="12"/><text x="225.0" y="183" class="head" text-anchor="middle">ESP32</text><text x="225.0" y="207" class="label" text-anchor="middle">USB-C data connection</text><rect class="box" x="90" y="308" width="270" height="65" rx="12"/><text x="225.0" y="336" class="head" text-anchor="middle">Mac sensor logger</text><text x="225.0" y="360" class="label" text-anchor="middle">Reads USB serial records</text><path d="M225 75 V155" class="wire"/><text x="240" y="119" class="label" text-anchor="start">USB cable</text><path d="M225 225 V308" class="wire" marker-end="url(#arrow)"/><text x="240" y="270" class="label" text-anchor="start">Sensor readings</text><text x="225" y="411" class="label" text-anchor="middle">Readings return through the same hub.</text></svg>