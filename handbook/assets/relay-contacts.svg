<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 245" role="img" aria-labelledby="title desc"><title id="title">Relay switches probe power</title><desc id="desc">Normally open relay contact connects 3.3V at COM to probe VCC only when activated. It does not switch a pump.</desc><defs><pattern id="water" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 8 Q4 3 8 8 T16 8" fill="none" stroke="#154d77" opacity=".35"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#154d77"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172a34;font-size:18px}.label{font-size:15px}.head{font-weight:750}.wire{fill:none;stroke:#154d77;stroke-width:3}.power{fill:none;stroke:#a84c0b;stroke-width:3;stroke-dasharray:8 5}.box{fill:#fffefa;stroke:#172a34;stroke-width:2}</style><rect width="450" height="245" fill="#fffefa"/><rect class="box" x="15" y="20" width="420" height="64" rx="12"/><text x="225.0" y="48" class="head" text-anchor="middle">Probe power: relay contact side</text><text x="225.0" y="72" class="label" text-anchor="middle">Separate from the relay coil supply</text><text x="30" y="127" class="head" text-anchor="start">3.3V</text><text x="420" y="127" class="head" text-anchor="end">Probe VCC</text><path d="M32 153 H160 M290 153 H418" class="power"/><circle cx="166" cy="153" r="6" fill="#fffefa" stroke="#172a34" stroke-width="2"/><circle cx="284" cy="153" r="6" fill="#fffefa" stroke="#172a34" stroke-width="2"/><path d="M172 150 L264 115" stroke="#172a34" stroke-width="4"/><text x="166" y="187" class="label" text-anchor="middle">COM</text><text x="284" y="187" class="label" text-anchor="middle">NO</text><text x="225" y="222" class="label" text-anchor="middle">Normally open · no pump</text></svg>