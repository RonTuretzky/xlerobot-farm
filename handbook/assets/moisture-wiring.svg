<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" role="img" aria-labelledby="title desc"><title id="title">Controller connections to Moisture probe</title><desc id="desc">Three leads connect switched 3.3V, common ground and the probe signal to an ESP32 analog input.</desc><defs><pattern id="water" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 8 Q4 3 8 8 T16 8" fill="none" stroke="#154d77" opacity=".35"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#154d77"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172a34;font-size:18px}.label{font-size:15px}.head{font-weight:750}.wire{fill:none;stroke:#154d77;stroke-width:3}.power{fill:none;stroke:#a84c0b;stroke-width:3;stroke-dasharray:8 5}.box{fill:#fffefa;stroke:#172a34;stroke-width:2}</style><rect width="450" height="320" fill="#fffefa"/><rect class="box" x="12" y="12" width="175" height="52" rx="12"/><text x="99.5" y="40" class="head" text-anchor="middle">Controller</text><rect class="box" x="263" y="12" width="175" height="52" rx="12"/><text x="350.5" y="40" class="head" text-anchor="middle">Moisture probe</text><text x="18" y="103" class="label" text-anchor="start">Switched 3.3V</text><text x="432" y="103" class="label" text-anchor="end">VCC</text><circle cx="28" cy="121" r="4" fill="#172a34"/><circle cx="422" cy="121" r="4" fill="#172a34"/><path d="M32 121 H418" class="power"/><text x="18" y="168" class="label" text-anchor="start">Common GND</text><text x="432" y="168" class="label" text-anchor="end">GND</text><circle cx="28" cy="186" r="4" fill="#172a34"/><circle cx="422" cy="186" r="4" fill="#172a34"/><path d="M32 186 H418" class="wire"/><text x="18" y="233" class="label" text-anchor="start">ESP32 ADC input</text><text x="432" y="233" class="label" text-anchor="end">SIG output</text><circle cx="28" cy="251" r="4" fill="#172a34"/><circle cx="422" cy="251" r="4" fill="#172a34"/><path d="M32 251 H418" class="wire"/></svg>